# cargo-deny policy (gate G2). Protected path (Class 3).
# Rules: no GPL/AGPL (wiki/rules-digest.md section 2); only crates.io; every
# external thing is also listed in THIRD_PARTY.md.

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Permissive licences only. Anything not listed (GPL, AGPL, LGPL, unknown) fails.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are Apache-2.0 (`license = "Apache-2.0"`, ADR-0023) and unpublished (`publish = false`).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
