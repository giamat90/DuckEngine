[workspace]
resolver = "3"
members = ["engine/skeleton", "engine/skeleton-unsafe", "engine/g1-control", "engine/base", "engine/platform", "engine/render", "engine/adapter_window_glfw", "engine/frame", "engine/app_runtime", "engine/tools_simd_bench", "engine/assets", "engine/tools_assetc", "engine/adapter_render_gl", "engine/tools_shaderc", "engine/tools_render_bench", "engine/app_sprite_sample", "engine/tools_physics_spike", "engine/jobs", "engine/tools_scheduler_spike", "engine/physics", "engine/tools_physics_bench", "engine/tools_physics3d_bench", "engine/app_physics_sample", "engine/adapter_runtime_libs", "engine/audio", "engine/adapter_audio_miniaudio", "engine/tools_audio_bench", "engine/app_audio_sample", "engine/adapter_render_vk", "engine/app_mesh_sample", "engine/tools_ecs_spike", "engine/ecs", "engine/tools_ecs_bench", "engine/scene", "engine/input", "engine/sync_physics", "engine/sync_render", "engine/sync_audio", "engine/app_sandbox", "engine/app_sandbox3d"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
publish = false
license = "Apache-2.0"
license-file = "LICENSE"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
too_many_lines = "warn"
too_many_arguments = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[profile.dev]
panic = "abort"

# Card 8-84: the physics crate is optimised in dev builds. Its tests (stability, scenes,
# goldens) dominate the headless job; debug code made them about 10 times slower. Overflow
# checks and debug assertions stay on (opt-level does not turn them off).
[profile.dev.package.physics]
opt-level = 2

[profile.release]
panic = "abort"
