[workspace]
resolver = "3"
members = ["engine/skeleton", "engine/skeleton-unsafe", "engine/g1-control"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
publish = false
license-file = "LICENSE"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
too_many_lines = "warn"
too_many_arguments = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
