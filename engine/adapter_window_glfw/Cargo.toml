[package]
name = "adapter_window_glfw"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
license-file.workspace = true
description = "Layer 3 adapter: the window and event port on GLFW, loaded at run time (stopgap)."

[dependencies]
base = { path = "../base", version = "0.1.0" }
platform = { path = "../platform", version = "0.1.0" }

[build-dependencies]
adapter_runtime_libs = { path = "../adapter_runtime_libs", version = "0.1.0" }

[dev-dependencies]
adapter_runtime_libs = { path = "../adapter_runtime_libs", version = "0.1.0" }
platform = { path = "../platform", version = "0.1.0", features = ["contract-tests"] }

# Not `workspace = true`: the workspace forbids unsafe code. This adapter denies it instead and
# allows it in two modules (`dynlib`, `glfw`), where every block is documented. The rest repeats
# the workspace lints.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
too_many_lines = "warn"
too_many_arguments = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
