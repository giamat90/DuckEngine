[package]
name = "sync_physics"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
license-file.workspace = true
description = "Layer 2 glue crate: connects the ecs and scene crates to the physics crate. A body handle is a component; forces go from the ECS into the physics world and body poses come back into the transforms. Physics stays free of the ECS. No unsafe code."

[dependencies]
base = { path = "../base", version = "0.1.0" }
ecs = { path = "../ecs", version = "0.1.0" }
physics = { path = "../physics", version = "0.1.0" }
scene = { path = "../scene", version = "0.1.0" }

[dev-dependencies]
frame = { path = "../frame", version = "0.1.0" }

[lints]
workspace = true
