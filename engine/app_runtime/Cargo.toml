[package]
name = "app_runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true
description = "Minimal L4 application crate; owns the one #[global_allocator] line (ADR-0022)."

[features]
default = ["mimalloc"]
# Switching back (ADR-0022 exit plan): build with --no-default-features for the default std allocator.
mimalloc = ["dep:mimalloc"]

[dependencies]
mimalloc = { version = "=0.1.52", optional = true, default-features = false }

[lints]
workspace = true
