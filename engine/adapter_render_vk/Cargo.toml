[package]
name = "adapter_render_vk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
license-file.workspace = true
description = "Layer 3 adapter: Vulkan 1.3 instance, device and queue (card 6-6), window surface, swapchain and clear colour (card 6-7), device memory sub-allocator, buffers, textures, samplers and staged uploads (card 6-8), the render device with frames, passes and barriers (card 6-9, part 4a), SPIR-V shaders, pipelines, descriptor sets, viewport and draw commands (card 6-14, part 4b), loaded at run time."

[dependencies]
base = { path = "../base", version = "0.1.0" }
platform = { path = "../platform", version = "0.1.0" }
render = { path = "../render", version = "0.1.0" }

[dev-dependencies]
adapter_window_glfw = { path = "../adapter_window_glfw", version = "0.1.0" }
assets = { path = "../assets", version = "0.1.0" }
render = { path = "../render", version = "0.1.0", features = ["contract-tests"] }

# Not `workspace = true`: the workspace forbids unsafe code. This adapter denies it instead and
# allows it in its FFI modules (`dynlib`, `lookup`, `entry`, `instance`, `device`, `debug`, `surface`,
# `gear`, `swapchain`, `frame`, `capture`, `presenter`, `memory`, `upload`, `resources`, `draw`, `render_device::exec`), where
# every block is documented. The rest repeats the workspace lints.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
too_many_lines = "warn"
too_many_arguments = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
