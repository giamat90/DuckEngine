[package]
name = "adapter_render_vk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
license-file.workspace = true
description = "Layer 3 adapter: Vulkan 1.3 instance, device and queue (card 6-6), window surface, swapchain and clear colour (card 6-7), loaded at run time."

[dependencies]
platform = { path = "../platform", version = "0.1.0" }

[dev-dependencies]
adapter_window_glfw = { path = "../adapter_window_glfw", version = "0.1.0" }

# Not `workspace = true`: the workspace forbids unsafe code. This adapter denies it instead and
# allows it in its FFI modules (`dynlib`, `lookup`, `entry`, `instance`, `device`, `debug`, `surface`,
# `gear`, `swapchain`, `frame`, `capture`, `presenter`), where
# every block is documented. The rest repeats the workspace lints.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
too_many_lines = "warn"
too_many_arguments = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
