[package]
name = "app_sandbox3d"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
license-file.workspace = true
description = "Layer 4 sample (card 8-11): the 3D sandbox. Spheres, boxes and capsules fall in a walled box, every object is an entity with a transform, a mesh and a body, and one frame runs the nine phases of the frame plan through the sync_physics, scene and sync_render glue crates, drawn lit with an orbit camera. No unsafe code."

[dependencies]
base = { path = "../base", version = "0.1.0" }
platform = { path = "../platform", version = "0.1.0" }
ecs = { path = "../ecs", version = "0.1.0" }
scene = { path = "../scene", version = "0.1.0" }
physics = { path = "../physics", version = "0.1.0" }
render = { path = "../render", version = "0.1.0" }
assets = { path = "../assets", version = "0.1.0" }
input = { path = "../input", version = "0.1.0" }
frame = { path = "../frame", version = "0.1.0" }
sync_physics = { path = "../sync_physics", version = "0.1.0" }
sync_render = { path = "../sync_render", version = "0.1.0" }
app_sprite_sample = { path = "../app_sprite_sample", version = "0.1.0" }
adapter_window_glfw = { path = "../adapter_window_glfw", version = "0.1.0" }
adapter_render_gl = { path = "../adapter_render_gl", version = "0.1.0" }

[dev-dependencies]
adapter_render_vk = { path = "../adapter_render_vk", version = "0.1.0" }
tools_shaderc = { path = "../tools_shaderc", version = "0.1.0" }
jobs = { path = "../jobs", version = "0.1.0" }

[lints]
workspace = true
