# Clippy configuration of the physics crate (card 4-19, governance).
#
# Clippy reads ONE clippy.toml per crate: the nearest one above the crate's manifest. This file
# therefore REPLACES the root clippy.toml for this crate, it does not extend it. The four clean-code
# thresholds are repeated here with the numbers of gates/gates.toml [clean_code]; tools/lint-profile
# fails CI when this file differs from gates.toml (a crate file must never relax a limit).
#
# The bans are the second line of defence of the physics determinism rules (wiki/architecture/physics.md
# section 3, rules 1, 6 and 7); the first line is the arch-check scan (gates/architecture.toml). The
# libm-dependent float functions and fused multiply-add are reached only through the deterministic math
# facade in `base` (dmath), which is not subject to this file. sqrt, abs, min, max, floor, ceil, ... are
# exact under IEEE 754 and stay allowed.
too-many-lines-threshold = 60
cognitive-complexity-threshold = 20
too-many-arguments-threshold = 5
excessive-nesting-threshold = 3

disallowed-methods = [
    { path = "f32::sin", reason = "libm-dependent float function; call the deterministic math facade in base (physics.md section 3, rule 7)" },
    { path = "f32::cos", reason = "libm-dependent float function; call the deterministic math facade in base (physics.md section 3, rule 7)" },
