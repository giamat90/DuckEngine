[package]
name = "base"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
license-file.workspace = true
description = "Layer 0 base crate: deterministic RNG, logging and assertions (std only, no OS access)."

[features]
# Scope markers of the profiling hook (`profile_scope!`) compile to nothing unless this is on.
profiling = []

# Not `workspace = true`: the workspace forbids unsafe code. This crate denies
# it instead and allows it in three modules (`alloc`, `arena`, `simd::sse2`), with every block
# documented (same pattern as `skeleton-unsafe`). The rest repeats the
# workspace lints.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
too_many_lines = "warn"
too_many_arguments = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
