[package]
name = "app_sandbox"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
license-file.workspace = true
description = "Layer 4 sample (card 7-12): the physics sandbox. Boxes and discs fall in a walled arena, every object is an entity with a transform, a sprite and a body, and one frame runs the nine phases of the frame plan through the sync_physics, scene, sync_render and sync_audio crates. An impact is a sound cue. No unsafe code."

[dependencies]
base = { path = "../base", version = "0.1.0" }
platform = { path = "../platform", version = "0.1.0" }
ecs = { path = "../ecs", version = "0.1.0" }
scene = { path = "../scene", version = "0.1.0" }
physics = { path = "../physics", version = "0.1.0" }
render = { path = "../render", version = "0.1.0" }
assets = { path = "../assets", version = "0.1.0" }
audio = { path = "../audio", version = "0.1.0" }
frame = { path = "../frame", version = "0.1.0" }
sync_physics = { path = "../sync_physics", version = "0.1.0" }
sync_render = { path = "../sync_render", version = "0.1.0" }
sync_audio = { path = "../sync_audio", version = "0.1.0" }
app_sprite_sample = { path = "../app_sprite_sample", version = "0.1.0" }
app_physics_sample = { path = "../app_physics_sample", version = "0.1.0" }
adapter_window_glfw = { path = "../adapter_window_glfw", version = "0.1.0" }
adapter_render_gl = { path = "../adapter_render_gl", version = "0.1.0" }

[dev-dependencies]
jobs = { path = "../jobs", version = "0.1.0" }

[lints]
workspace = true
