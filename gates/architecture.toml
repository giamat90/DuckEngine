# Architecture rules read by tools/arch-check. Protected path (Class 3): a change
# here is a governance change. Source: wiki/architecture/overview.md section 2
# and wiki/architecture/ports-and-adapters.md section 2 (std allow/deny list).
#
# Layers: 0 base, 1 runtime, 2 domain modules, 3 adapters, 4 applications.
# A crate may depend on its own layer and lower layers only (rule 1); only layer 4
# may depend on layer 3 (rule 4). A workspace crate that is neither mapped nor
# exempt is a violation (fail closed).

[layers]
base = 0
platform = 1
jobs = 1
ecs = 1
modules = 1
physics = 2
render = 2
audio = 2
assets = 2
scene = 2
input = 2
frame = 2
"sync_*" = 2
"adapter_*" = 3
"app_*" = 4
"tools_*" = 4

[rules]
# Crates that are not engine code (walking skeleton, gate controls): not checked.
exempt = ["skeleton", "skeleton-unsafe", "g1-control"]

# Dev-tool crates kept in the repository but built apart from the engine: the folder (from the
# workspace root, with "/") must hold a Cargo.toml with its own [workspace] table, so it cannot join
# the engine build by accident. They get none of the checks above: no engine crate may depend on them
# and CI does not build them. Card 1-28 (owner governance decision); first user: card 1-27.
standalone_tools = ["tools/alloc-bench"]

# The only code allowed to know two domain modules (overview section 3).
glue = ["frame", "sync_*"]

# Dependencies between two crates of the same layer (layers 1-3). Layer 0 and 4 are free.
allowed_edges = [
  ["jobs", "platform"],
  ["ecs", "jobs"],
  ["render", "jobs"],
  ["audio", "jobs"],
  ["assets", "jobs"],
  ["assets", "platform"],
  ["physics", "jobs"],
  ["scene", "ecs"],
  ["input", "platform"],
  ["adapter_window_glfw", "adapter_runtime_libs"],
  ["adapter_audio_miniaudio", "adapter_runtime_libs"],
]

# Dependencies that are refused although the layer rule would allow them, directly or
# through other crates. physics is standalone: no ECS dependency (wiki/architecture/physics.md).
forbidden_edges = [["physics", "ecs"]]

# External (non-workspace) crates that layers 0-2 may use. Empty: std only (policy v0.6).
allowed_external = []

# External crates that layers 0-2 may never use, in any dependency kind.
banned_crates = ["windows-sys", "windows", "winapi", "libc", "nix", "glfw", "sdl2", "miniaudio", "ash", "wgpu", "gl"]

# Source patterns (regex, applied to code with comments and strings removed) that layers 0-2
# may not contain. `crates` limits a rule to those crates; `allow_in` exempts crates; both
# accept globs. Every `use` tree is also flattened, so `use std::{fs, io};` is matched as
# `use std::fs;` and `use std::io;`, and `use std::fs as f;` also as `use std::fs;`.
# `allow_in_tests = true` (default false, card 1-4) also exempts test-only code: items under
# `#[cfg(test)]`, files whose own inner attribute is `#![cfg(test)]` (not one inside a module or macro)
# and files in the crate's `tests/` folder (unless a non-test cargo target builds that file). The
# exemption is by position, so production code on the same line as a test item is still checked. Only the
# exact form `cfg(test)` counts; `cfg(not(test))`, `cfg(any(test, ..))` and an out-of-line
# `#[cfg(test)] mod x;` file are not exempt (they stay findings). The exempt part of an item ends at its
# closing brace or at the first `;` or `,` outside brackets (a generic list `<A, B>` cuts it short: safe side).
[[banned_use]]
pattern = '\bstd\s*::\s*(?:fs|net|env|process|os|io|ffi)\b'
reason = "OS-facing std module; reach it through a port or inside an adapter or tool"
allow_in = ["platform"]

[[banned_use]]
pattern = '\buse\s+(?:::\s*)?std\s*(?:;|as\b|::\s*\*)|\bextern\s+crate\s+std\s+as\b'
reason = "std imported as a whole, aliased or by glob; name the std items so the rules can see them"
allow_in = ["platform"]

[[banned_use]]
pattern = '\bthread\s*::\s*(?:spawn|scope|Builder|\*)|\bstd\s*::\s*thread\s*::\s*\*|\bthread\s+as\b'
reason = "direct thread creation, or a rename of a module called thread that hides it; only the job system and platform may spawn threads (test-only code may)"
allow_in = ["jobs", "platform"]
allow_in_tests = true

[[banned_use]]
pattern = '\b(?:Instant|SystemTime)\b'
reason = "direct clock access; use the IClock port"
allow_in = ["platform"]

[[banned_use]]
pattern = '#\s*!?\s*\[[^\]]*\bpath\s*=|\binclude\s*!(?!=)'
reason = "a file pulled in from outside the crate's module tree escapes the source scan (#[path], also inside cfg_attr, and include!; include_str! and include_bytes! are fine)"

[[banned_use]]
pattern = '\bextern\s*\{|#\s*!?\s*\[\s*(?:unsafe\s*\(\s*)?link(?:_name)?\b'
reason = "foreign function block or link attribute; foreign code is reached only inside an adapter"

[[banned_use]]
pattern = '\b(?:std|core)\s*::\s*arch\b|\b(?:global_)?asm\s*!(?!=)'
reason = "architecture intrinsics and assembly; only the SIMD backends inside base may use them"
allow_in = ["base"]

# Cross-platform determinism of physics (D2) is opt-in and covers the physics crate only (owner,
# wiki v0.36, card 1-23; it had been withdrawn in v0.25, card 1-13). Physics reaches sin, cos, exp, ...
# only through the deterministic math facade in `base`, which picks the platform libm or the engine's own
# functions by the build option; so the libm-dependent functions (and `mul_add`, whose fallback on a CPU
# without hardware FMA is the platform's `fmaf`) are refused in `physics` and allowed in `base`.
[[banned_use]]
pattern = '\.\s*(?:sin|cos|tan|asin|acos|atan|atan2|sinh|cosh|tanh|asinh|acosh|atanh|sin_cos|exp|exp2|exp_m1|ln|ln_1p|log|log2|log10|powf|powi|hypot|cbrt|mul_add)\s*\('
reason = "libm-dependent float function in the physics crate; call the deterministic math facade in base"
crates = ["physics"]

[[banned_use]]
pattern = '(?:\b(?:f32|f64)|<\s*f(?:32|64)\b[^<>]*>)\s*::\s*(?:sin|cos|tan|asin|acos|atan|atan2|sinh|cosh|tanh|asinh|acosh|atanh|sin_cos|exp|exp2|exp_m1|ln|ln_1p|log|log2|log10|powf|powi|hypot|cbrt|mul_add)\b'
reason = "libm-dependent float function in the physics crate; call the deterministic math facade in base"
crates = ["physics"]

# Reciprocal and reciprocal-square-root estimate instructions are not even specified bit for bit and
# differ between vendors, so the simd abstraction offers none and a new one is a governance change.
# Fused multiply-add gives different bits from a separate multiply and add. The owner wants it used
# where the CPU has it (card 1-23): `physics` reaches it only through the `madd` function of the math
# facade, which is `a * b + c` whenever the D2 feature is on; the fused intrinsics themselves live in
# `base`, behind the facade, compiled out with the feature on (a review point: no scanner sees a cfg).
# The facade function is named `madd` and not `fma`, because the scan refuses the name `fma`.
# `std::arch` itself is already limited to `base` above.
[[banned_use]]
pattern = '\b_mm\w*(?:rsqrt|rcp)\w*|\bv(?:rsqrte|rsqrts|recpe|recps)\w*'
reason = "reciprocal or rsqrt estimate intrinsic; not bit-identical across CPUs (D2, physics determinism)"
crates = ["physics", "base"]

[[banned_use]]
pattern = '\b_mm\w*(?:fmadd|fmsub|fnmadd|fnmsub)\w*|\bv(?:fm[as]|ml[as])[qs]?_\w*f(?:16|32|64)\b|\bfmuladd\w*|\bfmaf?(?:32|64)?\b'
reason = "fused multiply-add intrinsic in the physics crate; call madd of the math facade in base"
crates = ["physics"]

[[banned_use]]
pattern = '\b(?:HashMap|HashSet)\b'
reason = "unordered iteration in a simulation crate"
crates = ["physics"]

[[banned_use]]
pattern = '\b(?:sort_unstable|select_nth_unstable)\w*\b'
reason = "unstable sort or selection in a simulation crate"
crates = ["physics"]
