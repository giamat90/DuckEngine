# Unsafe budget (gate G3, card 1-31; checked by tools/unsafe-budget). A protected path.
# Ratio: unsafe lines are at most max_percent of the code lines of the L0-L2 crates.
# Only the files listed here may hold `unsafe`; each has a line budget (the count when it was
# listed; lower it when the code shrinks, raise it only in a governance task).
max_percent = 5

[[modules]]
path = "engine/base/src/alloc.rs"
max_unsafe_lines = 29

[[modules]]
path = "engine/base/src/arena.rs"
max_unsafe_lines = 10

[[modules]]
path = "engine/base/src/fpenv.rs"
max_unsafe_lines = 12

[[modules]]
path = "engine/base/src/simd/sse2.rs"
max_unsafe_lines = 16

[[modules]]
path = "engine/base/src/simd/neon.rs"
max_unsafe_lines = 16

[[modules]]
path = "engine/jobs/src/pool/erased.rs"
max_unsafe_lines = 1

# Card 5-5 adds the lock-free single-producer single-consumer queue between the game thread and
# the audio thread (design: wiki/architecture/audio-port-v0.md section 3). `pending` until the
# file lands; the budget is an upper bound set before the code exists, to be lowered to the
# count when it is listed (card 5-5 reports it).
[[modules]]
path = "engine/base/src/spsc.rs"
max_unsafe_lines = 30
pending = true
