[package]
name = "alloc-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license-file = "../../LICENSE"
description = "Dev-time benchmark: the default global allocator against mimalloc (card 1-27, ADR-0022 evidence)"

[features]
# Build with `--features mimalloc-allocator` to install mimalloc as the global allocator.
mimalloc-allocator = ["dep:mimalloc"]

[dependencies]
mimalloc = { version = "=0.1.52", optional = true, default-features = false }

# A separate workspace: this tool is not part of the engine workspace and is not built by its CI.
[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
too_many_lines = "warn"
too_many_arguments = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[profile.release]
opt-level = 3
panic = "abort"
