name: pr-title

# The PR title becomes the squash commit message, which decides the release
# version. Runs trusted code from main (also for a PR into develop), never the PR tree.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v7.0.1, pinned by commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Check the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Bootstrap: the PR that introduces the checker has no checker in its base.
          if [ ! -f tools/release/check_pr_title.py ]; then
            echo "::notice::check_pr_title.py is not on the base branch yet; skipping"
            exit 0
          fi
          python tools/release/check_pr_title.py --title "$PR_TITLE"
      - name: Check the release footer of a develop PR
        if: github.event.pull_request.head.ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # The merge command passes this body as the merge commit body (delivery-pipeline, cards 1-38 and 2-9).
          python tools/release/check_squash_subject.py footer --batch-only --head-ref="$HEAD_REF" --message="$PR_BODY"
