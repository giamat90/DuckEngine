name: ci

# Runs on pushes to main and on demand, not on every branch push (card 1-38, CI budget). Work happens
# in `develop` and is validated locally; before an approval of a governance card the agent starts one run on the exact
# commit (`gh workflow run ci.yml --ref <branch>`); the develop-to-main PR runs the full CI (card 2-9).
# Merging is policy on the GitHub Free plan (no branch protection): the agent waits for green. On main it
# shows a broken merge result. It does not gate the release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  g1:
    name: build, test, fmt, clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      # actions/checkout v7.0.1, pinned by commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      # ADR-0022 exit plan: the application crate must build and pass its tests with the default allocator.
      - name: Lint the application crate without the mimalloc feature
        run: cargo clippy -p app_runtime --no-default-features --all-targets --locked -- -D warnings
      - name: Test the application crate without the mimalloc feature
        run: cargo test -p app_runtime --no-default-features --locked
      # Card 1-41: the profiling hook (`profile_scope!`) compiles to nothing with the feature off, so the default run never sees it.
      - name: Lint base with the profiling feature
        run: cargo clippy -p base --features profiling --all-targets --locked -- -D warnings
      - name: Test base with the profiling feature
        run: cargo test -p base --features profiling --locked
      - name: Test the metrics tool
        run: |
          python -m unittest -q test_report
          python -m unittest -q test_g1_assert
          python -m unittest -q test_approval_report
        working-directory: tools/metrics
      - name: Test the gate-check tool
        run: |
          python -m unittest -q test_check_digest
          python -m unittest -q test_governance_guard
          python -m unittest -q test_pr_gates
          python -m unittest -q test_protected_paths
        working-directory: tools/gate-check
      - name: Test the change classifier
        run: python -m unittest -q test_classify_change
        working-directory: tools/classify-change
      - name: Test the architecture checker
        run: python -m unittest -q test_arch_check
        working-directory: tools/arch-check
      - name: Test the unsafe budget checker
        run: python -m unittest -q test_unsafe_budget
        working-directory: tools/unsafe-budget
      - name: Test the wiki lint
        run: python -m unittest -q test_wiki_lint
        working-directory: tools/wiki-lint
      - name: Test the clean-code lint profile
        run: python -m unittest -q test_lint_profile
        working-directory: tools/lint-profile
      - name: Test the local gate script
        run: python -m unittest -q test_local_gates
        working-directory: tools/local-gates
      - name: Test the diff-hash tool
        run: python -m unittest -q test_diff_hash
        working-directory: tools/diff-hash
      - name: Test the swap-diff tool
        run: python -m unittest -q test_swap_diff
        working-directory: tools/swap-diff
      - name: Test the golden hash checker
        run: python -m unittest -q test_golden_check
        working-directory: tools/golden-check
      - name: Test the instruction-count gate
        run: python -m unittest -q test_icount_gate
        working-directory: tools/icount-gate
      - name: Test the release tools
        run: |
          python -m unittest -q test_next_version
          python -m unittest -q test_release_plan
          python -m unittest -q test_check_pr_title
          python -m unittest -q test_make_assets
          python -m unittest -q test_check_squash_subject
          python -m unittest -q test_workflows
        working-directory: tools/release
      - name: Test the task and review templates
        run: python -m unittest -q test_templates
        working-directory: tools/templates
      - name: Test the acceptance scenario validator
        run: python -m unittest -q test_validate
        working-directory: acceptance
      - name: Test the token probe
        run: python -m unittest -q test_probe
        working-directory: tools/token-probe

  # The gate tools and their configuration come from a checkout of main; the pushed commit is
  # only data (card 0c-5). A change to a tool or to gates/ is judged by main's rules and takes
  # effect once merged, so a change to gates/ together with what it judges (digest, wiki,
  # crate layout) needs two merges. The tools' own unit tests stay in g1: they test the code
  # of the push. Limit: arch-check runs cargo inside the push, so the push's rust-toolchain.toml
  # and .cargo/ are honoured (both are protected paths since 0c-9, so the governance guard flags them).
  # This workflow file is itself part of the push, so the owner reads any change to it.
  gates:
    name: gates from main (architecture, wiki, digest, report)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1, pinned by commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: head
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
        working-directory: head
      - name: Check the architecture rules
        run: python trusted/tools/arch-check/arch_check.py --config trusted/gates/architecture.toml --repo head
      - name: Check the unsafe budget
        run: python trusted/tools/unsafe-budget/unsafe_budget.py --config trusted/gates/unsafe-budget.toml --architecture trusted/gates/architecture.toml --repo head
      - name: Lint the wiki
        run: python trusted/tools/wiki-lint/wiki_lint.py --config trusted/gates/wiki-lint.toml --gates trusted/gates/gates.toml --repo head
      - name: Digest matches the gate configuration
        run: python trusted/tools/gate-check/check_digest.py --digest head/wiki/rules-digest.md --config trusted/gates/gates.toml --claude-md head/CLAUDE.md
      # Report only (the checks above already gate): the owner's metric report for this push.
      - name: Approval report
        if: ${{ !cancelled() && github.ref_type == 'branch' && github.ref != 'refs/heads/main' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          head_sha="$(git -C head rev-parse HEAD)"
          # A diff that cannot be hashed must still produce a report: the "Diff hash matches the diff" row then fails.
          diff_hash="$(python trusted/tools/diff-hash/diff_hash.py --repo head compute --base origin/main --head "$head_sha")" || diff_hash=0000000000000000
          python trusted/tools/metrics/approval_report.py --tools-dir trusted/tools --gates-dir trusted/gates --repo head --base origin/main --head "$head_sha" --diff-hash "$diff_hash" --out "$RUNNER_TEMP/report.md" || status=$?
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"

  # Baseline metrics: coverage, mutation and benchmark on the skeleton crate.
  # Report only: no threshold is enforced here (gate values are hypotheses and
  # are wired in when the gate configuration exists).
  metrics:
    name: metrics (${{ matrix.os }})
    if: github.ref_type == 'branch' && github.ref != 'refs/heads/main'   # report only and costly: skip on main and tags
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      # cargo-mutants must not see -D warnings: a mutant that trips a warning
      # would be counted as unviable instead of caught.
      RUSTFLAGS: ""
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cov_asset: cargo-llvm-cov-x86_64-pc-windows-msvc.zip
            cov_sha: 656590cfa13bb7478595bbfdd3bc6bc075a4f7f3f0df5a439c1856cb03c5a4d2
            mut_asset: cargo-mutants-x86_64-pc-windows-msvc.zip
            mut_sha: 2a2f00e47d4b458262a41501b0820aa26015fd35779903d2c8b30b2993f36791
          - os: ubuntu-latest
            cov_asset: cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz
            cov_sha: b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a
            mut_asset: cargo-mutants-x86_64-unknown-linux-gnu.tar.gz
            mut_sha: dfe6dc37d0342c891d2829b5a695aa57c2d0edecef7e7d0399a30cc6e206411e
    steps:
      # actions/checkout v7.0.1, pinned by commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: Install cargo-llvm-cov 0.9.1 and cargo-mutants 27.1.0
        run: |
          set -euo pipefail
          TOOLS="$RUNNER_TEMP/tools"
          mkdir -p "$TOOLS"
          fetch() {  # url, sha256
            local file="$TOOLS/$(basename "$1")"
            curl --fail --silent --show-error --location --output "$file" "$1"
            echo "$2  $file" | sha256sum --check --status
            case "$file" in
              *.zip) python -m zipfile -e "$file" "$TOOLS" ;;
              *) tar -xzf "$file" -C "$TOOLS" ;;
            esac
          }
          fetch "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/${{ matrix.cov_asset }}" "${{ matrix.cov_sha }}"
          fetch "https://github.com/sourcefrog/cargo-mutants/releases/download/v27.1.0/${{ matrix.mut_asset }}" "${{ matrix.mut_sha }}"
          echo "$TOOLS" >> "$GITHUB_PATH"
      - name: Coverage
        run: |
          mkdir -p metrics
          cargo llvm-cov --workspace --exclude g1-control --locked --json --summary-only --output-path metrics/coverage.json
      - name: Mutation
        run: |
          start=$SECONDS
          code=0
          cargo mutants -p skeleton -p skeleton-unsafe --jobs 2 --output metrics || code=$?
          echo "MUTATION_SECONDS=$((SECONDS - start))" >> "$GITHUB_ENV"
          # 0 all caught, 2 some missed, 3 timeouts: reported, not enforced yet.
          case "$code" in 0|2|3) ;; *) exit "$code" ;; esac
      - name: Mutation control (gate G1)
        run: |
          # g1-control is weakly tested on purpose: a low score proves the
          # mutation score discriminates. Missed mutants (exit 2) are expected.
          mkdir -p metrics/control
          code=0
          cargo mutants -p g1-control --jobs 2 --output metrics/control || code=$?
          case "$code" in 0|2|3) ;; *) exit "$code" ;; esac
      - name: Benchmark
        run: cargo bench -p skeleton --bench align --locked > metrics/bench.json
      - name: G1 assertion
        run: |
          python tools/metrics/g1_assert.py \
            --well-tested metrics/mutants.out/outcomes.json \
            --control metrics/control/mutants.out/outcomes.json \
            --seconds "$MUTATION_SECONDS"
      - name: Report
        run: |
          python tools/metrics/report.py --os "${{ matrix.os }}" \
            --coverage metrics/coverage.json \
            --mutants metrics/mutants.out/outcomes.json \
            --control-mutants metrics/control/mutants.out/outcomes.json \
            --bench metrics/bench.json \
            --mutation-seconds "$MUTATION_SECONDS" \
            --out metrics/metrics-report.md
          cat metrics/metrics-report.md >> "$GITHUB_STEP_SUMMARY"
      # actions/upload-artifact v7.0.2, pinned by commit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: metrics-report-${{ matrix.os }}
          path: metrics/metrics-report.md
          retention-days: 30

  # Gate G2: dependency policy (licences, bans, sources, advisories).
  deny:
    name: cargo-deny (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: cargo-deny-0.20.2-x86_64-pc-windows-msvc
            sha: 975a22143262fd27476d19ee00c7af67978426e40e1dee94eed6bbade1cf87dc
          - os: ubuntu-latest
            asset: cargo-deny-0.20.2-x86_64-unknown-linux-musl
            sha: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      # actions/checkout v7.0.1, pinned by commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: Install cargo-deny 0.20.2
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/${{ matrix.asset }}.tar.gz"
          echo "${{ matrix.sha }}  deny.tar.gz" | sha256sum --check --status
          tar -xzf deny.tar.gz
          echo "$RUNNER_TEMP/${{ matrix.asset }}" >> "$GITHUB_PATH"
      - name: Check
        run: cargo deny --locked check

  # Phase 2 exit criterion (card 2-8): the engine builds and passes its tests with no real OS, GPU or audio
  # adapter and no application crate present, only the Null and Headless implementations. `--exclude` alone
  # would still build an adapter that an engine crate depends on, so the first step also fails when an
  # excluded crate appears in the dependency graph of any target and any feature. One Linux job: the property is the same on every
  # OS, and Windows would bill double. (The banned-import and layering rules run in `gates`.)
  headless:
    name: headless-only build and test (no adapters)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1, pinned by commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: No adapter or application crate in the headless graph
        run: |
          set -euo pipefail
          cargo tree --workspace --exclude 'adapter_*' --exclude 'app_*' --locked --target all --all-features --edges normal,build,dev --prefix none --format '{p}' > "$RUNNER_TEMP/headless-graph.txt"
          test -s "$RUNNER_TEMP/headless-graph.txt"
          if grep -E '^(adapter_|app_)' "$RUNNER_TEMP/headless-graph.txt"; then
            echo "::error::an engine crate needs an adapter or application crate"
            exit 1
          fi
      - name: Build and test without adapters
        run: cargo test --workspace --exclude 'adapter_*' --exclude 'app_*' --locked

  # Phase 2 exit criterion (card 2-11): the real GLFW adapter and the window contract suite on Linux. The
  # windows are created without a graphics API, so a virtual X display (xvfb) is all it needs. GLFW comes
  # from the distribution package (THIRD_PARTY.md: Linux from the distribution package); the library is
  # loaded at run time (card 2-6). DUCK_REQUIRE_GLFW makes a missing library or display a failure, not a
  # skipped test. `main` can be behind `develop`: when the crate is not in the workspace the job says so
  # (a notice, "not run") instead of failing or passing silently. One Ubuntu job, on `main` and by hand.
  glfw_linux:
    name: GLFW adapter on Linux (xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1, pinned by commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: Find the adapter
        id: adapter
        run: |
          set -euo pipefail
          # Decided from the tree, not from cargo's exit code: once the crate folder exists, a cargo
          # failure (a broken manifest, a missing toolchain) fails this step instead of passing as "absent".
          if [ -d engine/adapter_window_glfw ]; then
            cargo pkgid -p adapter_window_glfw > /dev/null
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::not run: adapter_window_glfw is not in this workspace yet"
            echo "### GLFW on Linux: not run (adapter_window_glfw is not in this workspace yet)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install xvfb and GLFW
        if: steps.adapter.outputs.present == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libglfw3
          dpkg-query --show libglfw3
      - name: Test the adapter under a virtual display
        if: steps.adapter.outputs.present == 'true'
        env:
          DUCK_REQUIRE_GLFW: "1"
        run: xvfb-run --auto-servernum cargo test -p adapter_window_glfw --locked -- --nocapture

  # Card 3-12 (owner open question O7): the OpenGL adapter and the render contract suite on Linux, on Mesa's
  # software renderer (llvmpipe) under a virtual X display. The first step reports what the runner really
  # offers (`glxinfo`), so the question "does llvmpipe give OpenGL 4.5 core?" is answered by a run, not by
  # memory. A job meant to have a device sets DUCK_REQUIRE_GL=1, so a missing device fails instead of
  # skipping. `main` can be behind `develop`: when the crate is not in the workspace the job says so (a
  # notice, "not run") instead of failing or passing silently. One Ubuntu job, on `main` and by hand.
  gl_linux:
    name: OpenGL adapter on Linux (xvfb, llvmpipe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1, pinned by commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: Find the adapter
        id: adapter
        run: |
          set -euo pipefail
          # Decided from the tree, not from cargo's exit code (as for the GLFW job).
          if [ -d engine/adapter_render_gl ]; then
            cargo pkgid -p adapter_render_gl > /dev/null
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::not run: adapter_render_gl is not in this workspace yet"
            echo "### OpenGL on Linux: not run (adapter_render_gl is not in this workspace yet)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install xvfb, GLFW and Mesa
        if: steps.adapter.outputs.present == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libglfw3 mesa-utils libgl1-mesa-dri
          dpkg-query --show libglfw3 libgl1-mesa-dri mesa-utils
      - name: What the runner offers (llvmpipe, OpenGL version)
        if: steps.adapter.outputs.present == 'true'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum glxinfo -B | tee "$RUNNER_TEMP/glxinfo.txt"
          {
            echo "### OpenGL on Linux (llvmpipe)"
            grep -E 'OpenGL (renderer|core profile version|version) string' "$RUNNER_TEMP/glxinfo.txt" || echo "no OpenGL strings reported"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test the adapter and the render contract on GL
        if: steps.adapter.outputs.present == 'true'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          DUCK_REQUIRE_GL: "1"
        run: xvfb-run --auto-servernum cargo test -p adapter_render_gl --locked -- --nocapture

  # Card 2-10: the engine on real AArch64 hardware. A test run on 2026-11-01 showed that GitHub Free gives a
  # hosted ARM64 Linux runner (`ubuntu-24.04-arm`) for this private repository, so the NEON backend of `simd`
  # (card 2-7) is tested natively, not under an emulator. The adapters are left out (no GLFW or display
  # there; that is the job `glfw_linux`). On a tree without the NEON backend the same job tests the scalar
  # reference on AArch64. One Linux job, on `main` and by hand; billed as Linux (budget it as 1x).
  arm64:
    name: ARM64 hosted runner (clippy and tests, native)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1, pinned by commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check that this really is an AArch64 CPU
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          echo "### ARM64: ran natively on an AArch64 hosted runner ($(uname -m))" >> "$GITHUB_STEP_SUMMARY"
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: Clippy
        run: cargo clippy --workspace --exclude 'adapter_*' --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude 'adapter_*' --locked

  # Card 4-20: D2, the same physics state on Windows x86-64 and Linux x86-64 (rules-digest section 5, ADR-0007).
  # The golden file (gates/golden/physics-replay.toml) and the checker come from a checkout of main, like the
  # gate tools in `gates` (digest section 8): the pushed commit is the code under test and nothing else. The
  # recorder prints the state hash after chosen steps of 12 scenes with the feature `cross-platform-determinism`
  # on; the checker compares the lines with the file and a difference is red, with the first differing scene
  # and step. The only skip is "not run: physics crate absent": `main` can be behind `develop` and have no
  # `engine/physics/Cargo.toml` yet. The checker (`presence`) decides it from the two trees: a crate in the
  # pushed commit always runs the job (a missing recorder or golden is red); a crate on main that the pushed
  # commit lacks is red, never a skip. Report only: the cost step (feature on against off). ARM64 is not gated.
  # This workflow file is part of the push, so the owner reads any change to it.
  d2_determinism:
    name: D2 golden hashes (${{ matrix.os }}, feature on)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      # actions/checkout v7.0.1, pinned by commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: head
          persist-credentials: false
      - name: The golden file is well formed
        run: python trusted/tools/golden-check/golden_check.py lint --golden trusted/gates/golden/physics-replay.toml
      - name: Find the physics crate
        id: physics
        run: python trusted/tools/golden-check/golden_check.py presence --trusted trusted --head head --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Install the pinned toolchain
        if: steps.physics.outputs.present == 'true'
        run: rustup show active-toolchain
        working-directory: head
      # The build refuses fma itself (compile_error! in base) and the recorder prints the fma cfg; this step
      # also fails on the text, so a target-cpu in RUSTFLAGS or a Cargo config is caught before the build.
      - name: No target-cpu or fma flag in the build
        if: steps.physics.outputs.present == 'true'
        run: python trusted/tools/golden-check/golden_check.py flags --repo head
      - name: Record the hashes with the feature on
        if: steps.physics.outputs.present == 'true'
        run: |
          set -euo pipefail
          cargo test -p physics --features cross-platform-determinism --test determinism --locked -- golden:: --nocapture --test-threads=1 | tee "$RUNNER_TEMP/golden.txt"
        working-directory: head
      - name: Compare with the golden file of main
        if: steps.physics.outputs.present == 'true'
        run: python trusted/tools/golden-check/golden_check.py verify --golden trusted/gates/golden/physics-replay.toml --output "$RUNNER_TEMP/golden.txt" --summary "$GITHUB_STEP_SUMMARY"
      # Report only (D-10): the same recorder with the feature on and off, wall time of the run after both builds.
      - name: Cost of the feature (report only)
        if: steps.physics.outputs.present == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo test -p physics --features cross-platform-determinism --test determinism --locked --no-run
          cargo test -p physics --test determinism --locked --no-run
          timed() { local s e; s=$(date +%s%N); "$@" > /dev/null 2>&1 || true; e=$(date +%s%N); echo $(( (e - s) / 1000000 )); }
          on=$(timed cargo test -p physics --features cross-platform-determinism --test determinism --locked -- golden:: --test-threads=1)
          off=$(timed cargo test -p physics --test determinism --locked -- golden:: --test-threads=1)
          echo "### D2 cost on ${{ matrix.os }}: golden recorder, feature on ${on} ms, off ${off} ms (report only)" >> "$GITHUB_STEP_SUMMARY"
        working-directory: head

  # Card 4-21: ThreadSanitizer on Linux (physics-and-jobs-v0 section 6, ADR-0004 section 6). TSan does not exist
  # on the MSVC target and needs the sanitizer flag plus a rebuilt standard library, so this job uses a dated
  # toolchain that is not the repository's stable one. The date is pinned HERE, in `RUSTUP_TOOLCHAIN` below: it
  # overrides rust-toolchain.toml for this job only, and a bump is a diff of this file (a protected path), so
  # the owner reads it as a governance change. Never a floating channel. Runs on `main` and by hand like every
  # job of `ci`, not on a schedule (Actions minutes, R-24). Two runs of cargo, one command each, so a failing
  # step names what raced:
  #   1. the `jobs` crate: unit tests (pool tests, the scheduler contract at several worker counts, order
  #      independence) and its integration tests, with the feature `contract-tests`;
  #   2. the `physics` tests that use the pool (determinism, joints, parallel, parallel_allocation, stability),
  #      only when the crate exists. `main` can be behind `develop`, so the crate can be absent: the presence
  #      check of the D2 job decides it from the two trees (a crate in the push always runs; a crate on main that
  #      the push lacks is red) and the absence is written to the job summary, never green by silence.
  # The workspace profiles set panic = abort, which the test harness cannot use and which makes the rebuilt
  # `panic_abort` crate fail; the two profile variables below make this job build with unwinding (the race
  # detector does not depend on the panic strategy).
  # No `-D warnings` here: a dated toolchain has lints the
  # stable one does not (the first run failed on a deprecation of `fetch_update` in `platform`, which stable
  # 1.94.1 accepts); warnings stay gated by Clippy with -D warnings on the repository toolchain in `g1`. Doc tests are not run (rustdoc is not sanitized here). Nothing is excluded by name; the review lists what
  # was run. `halt_on_error=1`: the first report ends the test binary and the step is red. This workflow file is
  # part of the push, so the owner reads any change to it.
  tsan:
    name: ThreadSanitizer (ubuntu-latest, pinned dated toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-15
      RUSTFLAGS: -Zsanitizer=thread
      CARGO_TARGET_DIR: target-tsan
      TSAN_OPTIONS: halt_on_error=1
      CARGO_PROFILE_DEV_PANIC: unwind
      CARGO_PROFILE_RELEASE_PANIC: unwind
    defaults:
      run:
        shell: bash
    steps:
      # actions/checkout v7.0.1, pinned by commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: head
          persist-credentials: false
      - name: Find the physics crate
        id: physics
        run: python trusted/tools/golden-check/golden_check.py presence --trusted trusted --head head --github-output "$GITHUB_OUTPUT" --summary "$RUNNER_TEMP/presence.txt"
      - name: Install the pinned dated toolchain with the standard library source
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src
          rustc --version --verbose
          echo "### TSan toolchain: $(rustc --version)" >> "$GITHUB_STEP_SUMMARY"
        working-directory: head
      - name: Thread-sanitize the jobs tests
        run: cargo test -p jobs --features contract-tests --lib --tests --locked -Zbuild-std --target x86_64-unknown-linux-gnu
        working-directory: head
      # Not green by silence: the test binaries must really be instrumented (the sanitizer runtime entry point
      # is linked in). A build that dropped the flag would pass the tests above without checking anything.
      - name: Prove the test binaries are instrumented
        run: |
          set -euo pipefail
          binary=$(find target-tsan -type f -name 'jobs-*' -perm -u+x -print -quit)
          test -n "$binary"
          grep -q __tsan_init "$binary"
          echo "### TSan: $(basename "$binary") is instrumented (__tsan_init linked)" >> "$GITHUB_STEP_SUMMARY"
        working-directory: head
      - name: Thread-sanitize the physics tests
        if: steps.physics.outputs.present == 'true'
        run: cargo test -p physics --test determinism --test joints --test parallel --test parallel_allocation --test stability --locked -Zbuild-std --target x86_64-unknown-linux-gnu
        working-directory: head
      - name: Say that the physics tests did not run
        if: steps.physics.outputs.present != 'true'
        run: |
          echo "### TSan physics tests: not run: physics crate absent (engine/physics/Cargo.toml is on neither main nor the pushed commit)" >> "$GITHUB_STEP_SUMMARY"

  # Card 4-23: the physics instruction-count gate (rules-digest section 7: "PR benchmark gate on instruction counts
  # (warn 5%, fail 10%)"; physics-and-jobs-v0 O11). The measure is card 4-22's: the serial W1 pyramid of
  # `tools_physics_bench icount-workload` under `valgrind --tool=callgrind` on this Ubuntu runner (spread 0.0% over six
  # runs there; perf and Windows are not feasible; the parallel path is not counted).
  #   Meaning of the comparison: BASE is what `main` was before this run (the `main` tip for a manual run on a branch,
  #   the commit before the push for a push to `main`); HEAD is the pushed commit. Both are built and counted in THIS
  #   job, so a drift of the runner image or of valgrind moves both counts and cancels. For the release PR of
  #   `develop` into `main` this answers: how much more or less work does the physics workload do than on `main`.
  #   Ordinary card PRs into `develop` run no CI (card 1-38), so the gate speaks at the release and by hand.
  # `trusted` is `main` as it was BEFORE the run: for a push to `main` the ref `main` is the pushed commit itself, so
  # the checkout uses `github.event.before` there (the same SHA as base); on a manual run it is the `main` tip. A
  # push whose `before` is unreachable (new branch, force push) fails the checkout, which is red, never a skip.
  # Trust (digest section 8): the comparator, the bands (`gates/gates.toml [benchmark]`), the registered workload
  # (`gates/benchmarks.toml`) and the count parser come from the checkout of `main` (`trusted`); the pushed commit is
  # built and run as data. The count is read from valgrind's own log file, not from anything the program prints.
  #   * the gate tool not on `main` yet (only before the card that adds it is merged): stated in the summary;
  #   * tool in neither tree: the job writes "not run: physics benchmark tool absent" to the summary (never green by
  #     silence); tool deleted by the push: red; tool only in HEAD (the first release): "no baseline, recorded only",
  #     which is neither a pass nor a fail; the base measurement failing or a missing count: red;
  #   * above the warn band: a `::warning::` annotation and the summary; above the fail band: red.
  # Cost: valgrind from apt, two release builds of the benchmark tool (the engine crates it depends on) and four short
  # valgrind runs (a few seconds each); the budget is stated in reviews/4-23.md. Runs on `main` and by hand only.
  # This workflow file is part of the push, so the owner reads any change to it.
  physics_icount:
    name: Physics instruction count (ubuntu-latest, valgrind callgrind, base against head)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      # actions/checkout v7.0.1, pinned by commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'push' && github.event.before || 'main' }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'push' && github.event.before || 'main' }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: head
          persist-credentials: false
      # The pushed code runs in this job (cargo build runs its build scripts, the workload is its binary) as the
      # same user: make the gate files unwritable for it before any of it runs.
      - name: Lock the trusted checkout
        run: |
          set -euo pipefail
          sudo chown -R root:root trusted
          sudo chmod -R go-w trusted
      # Bootstrap: until the card that adds the gate tool is merged, main cannot supply it. That is stated in the
      # summary (not red, not silent); once the tool is on main this step is always ready=true.
      - name: Find the gate tool on main
        id: gate
        run: |
          set -euo pipefail
          if [ -f trusted/tools/icount-gate/icount_gate.py ] && [ -f trusted/gates/benchmarks.toml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Physics instruction count: not run: icount-gate is not on main yet (tools/icount-gate and gates/benchmarks.toml are absent from the trusted checkout)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Find the benchmark tool
        id: bench
        if: steps.gate.outputs.ready == 'true'
        run: python trusted/tools/icount-gate/icount_gate.py presence --gates trusted/gates/gates.toml --benchmarks trusted/gates/benchmarks.toml --base base --head head --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Install valgrind
        if: steps.bench.outputs.head == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
          valgrind --version
      - name: Build the benchmark tool of the pushed commit
        if: steps.bench.outputs.head == 'true'
        env:
          PACKAGE: ${{ steps.bench.outputs.package }}
        run: |
          set -euo pipefail
          rustup show active-toolchain
          cargo build --release -p "$PACKAGE" --locked
          echo "### Physics instruction count: head built with $(rustc --version)" >> "$GITHUB_STEP_SUMMARY"
        working-directory: head
      - name: Build the benchmark tool of the base tree
        if: steps.bench.outputs.base == 'true'
        env:
          PACKAGE: ${{ steps.bench.outputs.package }}
        run: |
          set -euo pipefail
          rustup show active-toolchain
          cargo build --release -p "$PACKAGE" --locked
          echo "### Physics instruction count: base built with $(rustc --version)" >> "$GITHUB_STEP_SUMMARY"
        working-directory: base
      - name: Count the instructions of the pushed commit
        if: steps.bench.outputs.head == 'true'
        env:
          PACKAGE: ${{ steps.bench.outputs.package }}
        run: python trusted/tools/icount-gate/icount_gate.py measure --gates trusted/gates/gates.toml --benchmarks trusted/gates/benchmarks.toml --bench "head/target/release/$PACKAGE" --out "$RUNNER_TEMP/head.json"
      - name: Count the instructions of the base tree
        if: steps.bench.outputs.base == 'true'
        env:
          PACKAGE: ${{ steps.bench.outputs.package }}
        run: python trusted/tools/icount-gate/icount_gate.py measure --gates trusted/gates/gates.toml --benchmarks trusted/gates/benchmarks.toml --bench "base/target/release/$PACKAGE" --out "$RUNNER_TEMP/base.json"
      - name: Compare with the bands of main
        if: steps.bench.outputs.head == 'true'
        env:
          HAS_BASE: ${{ steps.bench.outputs.base }}
        run: |
          set -euo pipefail
          args=()
          if [ "$HAS_BASE" = true ]; then args=(--base "$RUNNER_TEMP/base.json"); fi
          python trusted/tools/icount-gate/icount_gate.py compare --gates trusted/gates/gates.toml --benchmarks trusted/gates/benchmarks.toml --head "$RUNNER_TEMP/head.json" "${args[@]}" --summary "$GITHUB_STEP_SUMMARY"
