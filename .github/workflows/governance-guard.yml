name: governance-guard

# A PR that changes a protected path (gates/protected-paths.txt) must declare a
# governance task in its description. The tool and the list come from main (also
# for a PR into develop); the PR tree is checked out as data only and never executed.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v7.0.1, pinned by commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - name: Check protected paths against the description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Bootstrap: the PR that introduces the guard has no guard in its base.
          if [ ! -f base/tools/gate-check/governance_guard.py ] || [ ! -f base/gates/protected-paths.txt ]; then
            echo "::notice::governance_guard.py or protected-paths.txt is not on the base branch yet; skipping"
            exit 0
          fi
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          python base/tools/gate-check/governance_guard.py --repo head --base "$BASE_SHA" --head "$HEAD_SHA" \
            --paths base/gates/protected-paths.txt --body-file "$RUNNER_TEMP/pr-body.md"
